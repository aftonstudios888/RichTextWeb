name: Blazor
on:
  pull_request:
  push:
    branches: [main]
    paths: ['blazor/**', 'src/**', 'dist/**', 'package*.json', '.gitmodules', '.github/workflows/blazor.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked-in Blazor version from main
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  blazor:
    permissions:
      contents: write
    uses: wieslawsoltes/Dockyard/.github/workflows/blazor.yml@4b4f535ad14d920d2d82f44cefa82bb0a3dfe745
    with:
      project: blazor/src/RichTextWeb.Blazor.csproj
      package_name: RichTextWeb
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    secrets: inherit
