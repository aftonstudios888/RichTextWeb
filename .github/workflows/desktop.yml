name: Desktop qualification
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Compile and exercise the C# client against fake transports and the real Node engine
        run: |
          mkdir -p artifacts/desktop/protocol
          dotnet --info > artifacts/desktop/protocol/runtime.txt
          git rev-parse HEAD > artifacts/desktop/protocol/commit.txt
          dotnet run --project adapters/dotnet/Tests/RichTextWeb.Bridge.Tests.csproj -c Release | tee artifacts/desktop/protocol/source-checks.txt
      - name: Build Avalonia adapter against pinned official packages
        run: dotnet build adapters/dotnet/Avalonia/RichTextWeb.Avalonia.csproj -c Release
      - name: Produce native bridge packages
        run: |
          dotnet pack adapters/dotnet/Shared/RichTextWeb.Bridge.csproj -c Release -o artifacts/desktop/packages
          dotnet pack adapters/dotnet/Avalonia/RichTextWeb.Avalonia.csproj -c Release --no-build -o artifacts/desktop/packages
      - name: Verify the installed native package consumer
        run: dotnet run --project adapters/dotnet/Tests/RichTextWeb.Bridge.Tests.csproj -c Release -p:UsePackagedBridge=true -p:RestoreAdditionalProjectSources="${{ github.workspace }}/artifacts/desktop/packages" | tee artifacts/desktop/protocol/package-checks.txt
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-shared-and-avalonia-packages
          path: artifacts/desktop
          if-no-files-found: error
  windows-webview2:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Compile native WPF and WinUI integrations
        run: |
          dotnet build adapters/dotnet/Wpf/RichTextWeb.Wpf.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild adapters/dotnet/WinUI/RichTextWeb.WinUI.csproj /restore /t:Build /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare self-contained editor assets
        run: node adapters/dotnet/scripts/prepare-assets.mjs artifacts/desktop/web
      - name: Ensure Evergreen WebView2 runtime
        shell: pwsh
        run: |
          $installed = Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe' -ErrorAction SilentlyContinue
          if (-not $installed) {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\WebView2Bootstrapper.exe"
            $install = Start-Process "$env:RUNNER_TEMP\WebView2Bootstrapper.exe" -ArgumentList '/silent','/install' -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "WebView2 installation failed: $($install.ExitCode)" }
          }
      - name: Exercise real WPF WebView2 and capture rendered evidence
        shell: pwsh
        run: |
          dotnet run --project adapters/dotnet/Samples/WpfSmoke/RichTextWeb.WpfSmoke.csproj -c Release -- --smoke --assets "$env:GITHUB_WORKSPACE\artifacts\desktop\web" --report "$env:GITHUB_WORKSPACE\artifacts\desktop\smoke"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and exercise real WinUI WebView2
        shell: pwsh
        run: |
          $project = 'adapters/dotnet/Samples/WinUiSmoke/RichTextWeb.WinUiSmoke.csproj'
          msbuild $project /restore /t:Build /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = Get-ChildItem adapters/dotnet/Samples/WinUiSmoke/bin -Filter RichTextWeb.WinUiSmoke.exe -Recurse | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $app) { throw 'WinUI executable was not built' }
          & $app.FullName --smoke --assets "$env:GITHUB_WORKSPACE\artifacts\desktop\web" --report "$env:GITHUB_WORKSPACE\artifacts\desktop\winui"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content artifacts/desktop/winui/winui-webview2.json -Raw | ConvertFrom-Json
          if (-not $report.passed) { throw 'WinUI runtime checks failed' }
      - name: Exercise real Avalonia NativeWebView
        shell: pwsh
        run: |
          dotnet run --project adapters/dotnet/Samples/AvaloniaSmoke/RichTextWeb.AvaloniaSmoke.csproj -c Release -- --smoke --assets "$env:GITHUB_WORKSPACE\artifacts\desktop\web" --report "$env:GITHUB_WORKSPACE\artifacts\desktop\avalonia"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content artifacts/desktop/avalonia/avalonia-webview.json -Raw | ConvertFrom-Json
          if (-not $report.passed) { throw 'Avalonia runtime checks failed' }
      - name: Package native hosts and runnable WPF sample
        shell: pwsh
        run: |
          dotnet pack adapters/dotnet/Wpf/RichTextWeb.Wpf.csproj -c Release --no-build -o artifacts/desktop/packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild adapters/dotnet/WinUI/RichTextWeb.WinUI.csproj /t:Pack /p:Configuration=Release /p:Platform=x64 /p:NoBuild=true /p:PackageOutputPath="$env:GITHUB_WORKSPACE\artifacts\desktop\packages"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish adapters/dotnet/Samples/WpfSmoke/RichTextWeb.WpfSmoke.csproj -c Release --no-self-contained -o artifacts/desktop/wpf-sample
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item artifacts/desktop/web artifacts/desktop/wpf-sample/web -Recurse
          dotnet publish adapters/dotnet/Samples/AvaloniaSmoke/RichTextWeb.AvaloniaSmoke.csproj -c Release --no-self-contained -o artifacts/desktop/avalonia-sample
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item artifacts/desktop/web artifacts/desktop/avalonia-sample/web -Recurse
          msbuild adapters/dotnet/Samples/WinUiSmoke/RichTextWeb.WinUiSmoke.csproj /t:Publish /p:Configuration=Release /p:Platform=x64 /p:PublishDir="$env:GITHUB_WORKSPACE\artifacts\desktop\winui-sample\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item artifacts/desktop/web artifacts/desktop/winui-sample/web -Recurse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-windows-qualification
          path: artifacts/desktop
          if-no-files-found: warn
