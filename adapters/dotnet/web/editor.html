<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RichTextWeb native host</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font: 14px system-ui;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      rich-text-toolbar {
        display: block;
        flex: none;
      }
      rich-text-box {
        display: block;
        flex: 1;
        min-height: 0;
      }
    </style>
    <script src="./richtextweb.global.js"></script>
  </head>
  <body>
    <rich-text-toolbar
      for="editor"
      aria-label="Document commands"
    ></rich-text-toolbar>
    <rich-text-box
      id="editor"
      aria-label="Document editor"
      theme="light"
    ></rich-text-box>
    <script>
      RichTextWeb.registerRichTextWeb();
      RichTextWeb.registerRichTextToolbar();
      const editor = document.querySelector("rich-text-box");
      const options = {
        isReadOnly: () => editor.IsReadOnly,
        includeDocumentInEvents: true,
      };
      if (typeof window.invokeCSharpAction === "function") {
        window.richTextBridge = RichTextWeb.connectScriptHost(
          editor.Engine,
          window,
          (json) => window.invokeCSharpAction(json),
          options,
        );
      } else if (window.chrome?.webview) {
        window.richTextBridge = RichTextWeb.connectWebView2(
          editor.Engine,
          window.chrome.webview,
          options,
        );
      } else {
        const notice = document.createElement("p");
        notice.textContent =
          "Native messaging is unavailable. This editor still works in your browser.";
        document.body.prepend(notice);
      }
      window.addEventListener(
        "pagehide",
        () => window.richTextBridge?.Dispose(),
        { once: true },
      );
    </script>
  </body>
</html>
